name: Publish

# Stages a release on npm when a version tag (v1.2.3) is pushed, using npm
# Trusted Publishing: no npm token is stored anywhere. A maintainer then
# approves the staged version on npmjs.com (with 2FA) to publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # `npm stage` needs npm 12+.
      - run: npm install -g npm@12
      - run: npm stage publish .
